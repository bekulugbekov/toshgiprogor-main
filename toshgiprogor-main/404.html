<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>404 — Страница не найдена | ТАШГИПРОГОР</title>
  <link rel="icon" href="/assets/favicon-D3UvinYg.png" type="image/png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 40px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .code {
      font-size: 96px;
      font-weight: 800;
      color: #003087;
      line-height: 1;
      letter-spacing: -4px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 16px 0 8px;
    }
    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: #003087;
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #001f5a; }
    .logo {
      display: block;
      margin: 0 auto 32px;
      font-size: 18px;
      font-weight: 700;
      color: #003087;
      text-decoration: none;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="card">
    <a class="logo" href="/">TOSHGIPROGOR</a>
    <div class="code">404</div>
    <h1 id="title">Страница не найдена</h1>
    <p id="desc">Запрошенная страница не существует.</p>
    <a class="btn" href="/" id="homeBtn">Вернуться на главную</a>
  </div>
  <script>
    (function() {
      var t = {
        ru: { html: 'ru', title: 'Страница не найдена', desc: 'Запрошенная страница не существует.', btn: 'Вернуться на главную' },
        uz: { html: 'uz', title: 'Sahifa topilmadi', desc: "So'ralgan sahifa mavjud emas.", btn: 'Bosh sahifaga qaytish' },
        en: { html: 'en', title: 'Page not found', desc: 'The requested page does not exist.', btn: 'Return to home' },
        zh: { html: 'zh-Hans', title: '页面未找到', desc: '所请求的页面不存在。', btn: '返回首页' }
      };
      var saved = localStorage.getItem('selectedLanguage');
      var bl = (navigator.language || '').toLowerCase();
      var lang = saved || (bl.startsWith('zh') ? 'zh' : bl.startsWith('uz') ? 'uz' : bl.startsWith('en') ? 'en' : 'ru');
      var c = t[lang] || t.ru;
      document.documentElement.lang = c.html;
      document.getElementById('title').textContent = c.title;
      document.getElementById('desc').textContent = c.desc;
      document.getElementById('homeBtn').textContent = c.btn;
      document.title = '404 — ' + c.title + ' | TOSHGIPROGOR';
    })();
  </script>
</body>
</html>
